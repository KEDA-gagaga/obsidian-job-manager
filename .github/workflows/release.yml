name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: node --check obsidian-plugin/main.js
      - run: node tests/test_module.js
      - run: node tests/test_research.js
      - run: node tests/test_picker.js
      - run: node tests/test_transactions.js
      - run: node tests/test_extension.mjs
      - run: python scripts/audit_package.py
      - run: python scripts/build_release.py --label ${{ matrix.label }}
      - run: python scripts/smoke_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            release/*.zip
            release/*.sha256
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.zip
            release/*.sha256
          fail_on_unmatched_files: true
